<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#174d2b">
    <title>AgroPrice — Offline</title>
    <style>
      :root{font-family:Arial,"Nirmala UI",sans-serif;color:#203327;background:#f8fcf7}
      *{box-sizing:border-box}
      body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
      main{width:min(100%,440px);padding:30px;background:#fff;border:1px solid #dce9dc;border-radius:20px;box-shadow:0 12px 36px #174d2b12;text-align:center}
      .mark{width:72px;height:72px;margin:0 auto 18px}
      h1{margin:0;color:#174d2b;font-size:26px}
      p{color:#66756a;line-height:1.7}
      a{display:inline-block;margin-top:8px;padding:12px 20px;border-radius:10px;background:#28733e;color:#fff;font-weight:700;text-decoration:none}
      .mr{margin-top:22px;padding-top:18px;border-top:1px solid #dce9dc}
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/agroprice-icon.svg" alt="">
      <h1>You’re offline</h1>
      <p>Connect to the internet to view the latest Amravati APMC rates and send enquiries.</p>
      <a href="/">Try again</a>
      <div class="mr" lang="mr">
        <h1>इंटरनेट जोडलेले नाही</h1>
        <p>आजचे बाजारभाव पाहण्यासाठी आणि चौकशी पाठवण्यासाठी इंटरनेटशी कनेक्ट करा.</p>
      </div>
    </main>
  </body>
</html>
